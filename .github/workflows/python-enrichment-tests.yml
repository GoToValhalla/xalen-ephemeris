name: Python enrichment tests

on:
  pull_request:
    paths:
      - 'crates/xalen-python/**'
      - 'crates/xalen-western/**'
      - '.github/workflows/python-enrichment-tests.yml'

permissions:
  contents: read

jobs:
  test-python-enrichment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip maturin pytest
      - name: Build wheel
        working-directory: crates/xalen-python
        run: maturin build --release --features extension-module --out ../../dist
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Test enrichment bindings
        run: pytest -q crates/xalen-python/tests/test_vedic_presentation.py crates/xalen-python/tests/test_western_enrichment.py
