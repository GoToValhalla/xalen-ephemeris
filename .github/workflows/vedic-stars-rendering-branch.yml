name: Vedic stars rendering branch

on:
  push:
    branches: [feat/vedic-stars-rendering]
    paths:
      - '.github/workflows/vedic-stars-rendering-branch.yml'

permissions:
  contents: write

jobs:
  wire-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vedic-stars-rendering
          fetch-depth: 0

      - name: Wire modules, harden Shadbala names, append type stubs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lib = Path('crates/xalen-python/src/lib.rs')
          s = lib.read_text()
          old = 'mod advanced;\nmod swe_compat;'
          new = 'mod advanced;\nmod presentation;\nmod swe_compat;\nmod vedic_extra;'
          if old not in s and new not in s:
              raise SystemExit('lib.rs module anchor not found')
          s = s.replace(old, new, 1)
          old = '    advanced::register(m)?;\n'
          new = '    advanced::register(m)?;\n    vedic_extra::register(m)?;\n    presentation::register(m)?;\n'
          if old not in s and new not in s:
              raise SystemExit('lib.rs register anchor not found')
          s = s.replace(old, new, 1)
          lib.write_text(s)

          v = Path('crates/xalen-python/src/vedic_extra.rs')
          s = v.read_text()
          helper_anchor = '/// Full six-fold Shadbala over the existing BPHS-oriented XALEN core.\n'
          helper = '''fn canonical_planet_name(name: &str) -> PyResult<&'static str> {\n    match name.to_ascii_lowercase().as_str() {\n        "sun" => Ok("Sun"),\n        "moon" => Ok("Moon"),\n        "mars" => Ok("Mars"),\n        "mercury" => Ok("Mercury"),\n        "jupiter" => Ok("Jupiter"),\n        "venus" => Ok("Venus"),\n        "saturn" => Ok("Saturn"),\n        other => Err(pyo3::exceptions::PyValueError::new_err(format!(\n            "unsupported Shadbala planet '{other}'; expected Sun, Moon, Mars, Mercury, Jupiter, Venus, or Saturn"\n        ))),\n    }\n}\n\n'''
          if 'fn canonical_planet_name(' not in s:
              if helper_anchor not in s:
                  raise SystemExit('vedic_extra.rs helper anchor not found')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)
          old_block = '''    let core_positions: Vec<PlanetPosition> = all_planets\n        .iter()\n        .map(|(name, longitude, pspeed)| PlanetPosition {\n            name: Box::leak(name.clone().into_boxed_str()),\n            longitude: *longitude,\n            speed: *pspeed,\n        })\n        .collect();\n'''
          new_block = '''    let mut core_positions = Vec::with_capacity(all_planets.len());\n    for (name, longitude, pspeed) in &all_planets {\n        core_positions.push(PlanetPosition {\n            name: canonical_planet_name(name)?,\n            longitude: *longitude,\n            speed: *pspeed,\n        });\n    }\n'''
          if old_block not in s and new_block not in s:
              raise SystemExit('vedic_extra.rs Shadbala block anchor not found')
          s = s.replace(old_block, new_block, 1)
          # Validate the requested target planet too; avoids silently returning zeroes.
          target_old = '    let s = Shadbala::compute_full(planet, lon_deg, house, speed, &input);\n'
          target_new = '    let planet = canonical_planet_name(planet)?;\n    let s = Shadbala::compute_full(planet, lon_deg, house, speed, &input);\n'
          s = s.replace(target_old, target_new, 1)
          v.write_text(s)

          pyi = Path('crates/xalen-python/xalen.pyi')
          s = pyi.read_text()
          marker = '# Vedic enrichment + fixed-star/rendering bindings (Tarot project)'
          if marker not in s:
              s += r'''

# ---------------------------------------------------------------------------
# Vedic enrichment + fixed-star/rendering bindings (Tarot project)
# ---------------------------------------------------------------------------

def ashtakavarga(planet_signs: List[int]) -> Dict[str, Any]: ...
def ashtottari_dasha(moon_sidereal_deg: float, birth_jd: float) -> List[Dict[str, Any]]: ...
def yogini_dasha(moon_sidereal_deg: float, birth_jd: float) -> List[Dict[str, Any]]: ...
def ashtakoota(
    boy_nakshatra_index: int,
    girl_nakshatra_index: int,
    boy_rashi_index: int,
    girl_rashi_index: int,
) -> Dict[str, Any]: ...
def shadbala(
    planet: str,
    lon_deg: float,
    house: int,
    speed: float,
    jd: float,
    sun_lon: float,
    moon_lon: float,
    day_fraction: float,
    all_planets: List[tuple[str, float, float]],
) -> Dict[str, Any]: ...
def mangal_dosha(
    mars_house_from_lagna: int,
    mars_house_from_moon: int,
    mars_house_from_venus: int,
    mars_nakshatra_index: int,
    jupiter_aspects_mars: bool = ...,
    mars_in_own_sign: bool = ...,
    mars_in_exaltation: bool = ...,
) -> Dict[str, Any]: ...
def kaal_sarpa_dosha(rahu_house: int, ketu_house: int, planet_houses: List[int]) -> Dict[str, Any]: ...
def pitra_dosha(
    sun_house: int,
    saturn_house: int,
    rahu_house: int,
    ninth_lord_house: int,
    ninth_lord_debilitated: bool,
) -> Dict[str, Any]: ...
def pancha_mahapurusha_yoga(planet: str, rashi_index: int, house: int) -> Dict[str, Any] | None: ...
def gajakesari_yoga(jupiter_house: int, moon_house: int) -> Dict[str, Any] | None: ...
def budhaditya_yoga(sun_house: int, mercury_house: int) -> Dict[str, Any] | None: ...
def vipreeta_raja_yoga(lord_6_house: int, lord_8_house: int, lord_12_house: int) -> List[Dict[str, Any]]: ...
def kemadruma_yoga(moon_house: int, supporting_planet_houses: List[int]) -> Dict[str, Any] | None: ...
def fixed_star(name: str, year: float = ...) -> Dict[str, Any] | None: ...
def yogatara(nakshatra_index: int, year: float = ...) -> Dict[str, Any] | None: ...
def fixed_star_catalog_info() -> Dict[str, Any]: ...
def render_chart_svg(
    style: str,
    planet_positions: List[tuple[str, int, float]],
    house_cusps_deg: List[float],
    ascendant_sign_index: int,
    ayanamsa_deg: float = ...,
) -> str: ...
'''
              pyi.write_text(s)
          PY

      - name: Rust format
        run: cargo fmt --all --check || (cargo fmt --all && git diff --check)

      - name: Rust tests
        run: cargo test --workspace --release

      - name: Build and test Python extension
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest
          cd crates/xalen-python
          maturin build --release --features extension-module --out ../../dist
          python -m pip install --force-reinstall ../../dist/*.whl
          cd ../..
          pytest -q crates/xalen-python/tests/test_vedic_presentation.py

      - name: Commit generated wiring and formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/xalen-python/src/lib.rs crates/xalen-python/src/vedic_extra.rs crates/xalen-python/xalen.pyi crates/xalen-python/src/presentation.rs crates/xalen-python/Cargo.toml crates/xalen-python/tests/test_vedic_presentation.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(python): expose Vedic stars and rendering APIs'
            git push origin HEAD:feat/vedic-stars-rendering
          fi
